[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rerack"
version = "0.1.0"
description = "AI-powered secondhand clothing finder with outfit suggestions and fit cards"
requires-python = ">=3.10"
dependencies = [
    "groq==0.15.0",
    "python-dotenv==1.0.1",
    "gradio>=6.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
include = [
    "agent.py",
    "app.py",
    "tools.py",
    "utils/",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
